<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Images/favicon.png">
</head>
<body>
    <h3 id="h3">Website</h3>
    <div id="nav-placeholder"></div>
    <main>
        <div class="settingContainer">
            <div id="modeBtn">
                <span class="labelText">Dark Mode:</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeBtn">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="fontSize">
                <label>Font Size:</label>
                <a id="small" class="fontBtn" onclick="changeFontSize('small')">Small</a>
                <a id="med" class="fontBtn active" onclick="changeFontSize('medium')">Medium</a>
                <a id="Big" class="fontBtn" onclick="changeFontSize('large')">Big</a>
            </div>
            <div id="autoPlay">
                <span class="labelText">Auto-Play Video:</span>
                <label class="switch">
                    <input type="checkbox" id="autoPlayBtn">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="reset">
                <a id="resetBtn">Reset Settings</a>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
